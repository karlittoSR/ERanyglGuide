name: Translation staleness

# Opens an issue when the English guide changes without a matching French
# update in the same push. This is the point of moving to git: you stop
# relying on remembering that the translation drifted.

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "First push on this branch - skipping."
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          EN=$(echo "$CHANGED" | grep -E '^docs/guide/' || true)
          FR=$(echo "$CHANGED" | grep -E '^docs/fr/guide/' || true)
          echo "EN changed: ${EN:-none}"
          echo "FR changed: ${FR:-none}"
          if [ -n "$EN" ] && [ -z "$FR" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOFLIST"
              echo "$EN"
              echo "EOFLIST"
            } >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.diff.outputs.stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7)
            const files = `${{ steps.diff.outputs.files }}`
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `FR translation behind EN (${sha})`,
              labels: ['translation'],
              body: [
                `The English guide changed in ${context.sha} with no matching French update.`,
                '',
                '**Files changed:**',
                '```',
                files.trim(),
                '```',
                '',
                `Compare: ${context.payload.compare || 'see commit history'}`,
                '',
                'Close this once `docs/fr/guide/` is updated and its `source_rev` is bumped.'
              ].join('\n')
            })
